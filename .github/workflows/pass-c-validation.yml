name: Temporary Pass C Validation
on:
  push:
    branches: [pass-c-validation-temp]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen analytical stack
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==2.2.3" "numpy==2.1.3" "scipy==1.16.3" "scikit-learn==1.6.1" "pyarrow==23.0.1" "emoji==2.16.0" "vaderSentiment==3.3.2" "gdown==5.2.0"
      - name: Obtain frozen Sentiment140 sample if link-accessible
        continue-on-error: true
        run: |
          mkdir -p pass_c_inputs
          gdown --id 1Q3FkyjY3tMcAJT6l0Fn9F7MBU5z6MjSk -O pass_c_inputs/df_sentiment140_eval_sample_final.parquet
      - name: Run Pass C validation
        run: python tmp_pass_c/run_pass_c.py
      - name: Upload Pass C outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-c-validation-results
          path: pass_c_outputs/
          if-no-files-found: warn
